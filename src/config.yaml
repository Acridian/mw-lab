site:
  name: Лаборатория Микроволн
  site: 'https://mw-lab.ru'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Лаборатория Микроволн — Профессиональное оборудование спутниковой связи
    template: '%s | MW-Lab'
  description: "Разработчик и производитель профессионального оборудования спутниковой связи. Усилители мощности, преобразователи частоты, системы резервирования. Более 10 лет опыта."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: MW-Lab
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@mwlab'
    site: '@mwlab'
    cardType: summary_large_image

i18n:
  language: ru
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 9

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'publikatsii' # Blog main path, changed to match WordPress URL structure
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

  products:
    isEnabled: true
    productsPerPage: 12

    product:
      isEnabled: true
      permalink: '/products/%slug%' # Variables: %slug%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'products' # Products main path
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'products/category' # Category path /products/category/some-category
      robots:
        index: true

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
